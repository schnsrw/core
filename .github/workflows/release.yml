name: Release

# Cuts a GitHub release AND publishes `@schnsrw/core` to npm on a
# `vX.Y.Z` tag push. The job builds the WASM bundle and the TypeScript
# wrapper, packs them into a tarball attached to the GitHub release,
# and then runs `npm publish` (requires NPM_TOKEN repo secret with an
# automation token from https://www.npmjs.com/settings/<user>/tokens).
#
# The live demo at https://schnsrw.github.io/core/ is deployed by
# `pages.yml` on every push to `main`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build wasm + cut GitHub release + publish npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build wasm
        run: wasm-pack build ffi/wasm --target web --release --out-dir ../../js/wasm

      - name: Build @schnsrw/core
        working-directory: js
        run: |
          npm install
          npm run build:ts

      - name: Verify package.json version matches tag
        working-directory: js
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match js/package.json ($PKG_VERSION). Update package.json and re-tag."
            exit 1
          fi
          echo "Publishing @schnsrw/core@$PKG_VERSION"

      - name: Pack release tarball
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="casual-core-${VERSION}.tar.gz"
          tar -czf "$OUT" \
            -C js \
            dist wasm package.json README.md
          echo "tarball=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.pack.outputs.tarball }}

      - name: Publish to npm
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Scoped public package; explicit --access public required on first
          # publish so npm doesn't default to private (which fails for free
          # accounts). Subsequent versions inherit the scope's setting.
          npm publish --provenance --access public
