name: Release

# Cuts a GitHub release on a `vX.Y.Z` tag push. Builds the WASM bundle
# and the `@schnsrw/core` TS wrapper, packs them into a tarball, and
# attaches the tarball to the release so people can download a tested
# build straight from GitHub.
#
# The npm publish step has been intentionally removed for the 0.x line.
# The live demo at https://schnsrw.github.io/core/ is deployed by
# `pages.yml` on every push to `main`, so end users have a working
# in-browser test surface even without an npm package.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build wasm + cut GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build wasm
        run: wasm-pack build ffi/wasm --target web --release --out-dir ../../js/wasm

      - name: Build @schnsrw/core
        working-directory: js
        run: |
          npm install
          npm run build:ts

      - name: Pack release tarball
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="casual-core-${VERSION}.tar.gz"
          tar -czf "$OUT" \
            -C js \
            dist wasm package.json README.md
          echo "tarball=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.pack.outputs.tarball }}
