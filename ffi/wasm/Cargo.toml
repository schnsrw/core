[package]
name = "s1engine-wasm"
description = "WebAssembly bindings for Casual Core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
s1engine = { workspace = true, features = ["layout", "pdf", "convert"] }
s1-model = { workspace = true }
s1-layout = { workspace = true }
s1-text = { workspace = true }
s1-format-pdf = { workspace = true, features = ["pdf-editing"] }
s1-ops = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# wasm-pack's bundled wasm-opt is older than the Rust toolchain output, which
# emits bulk-memory ops by default. Re-enable bulk-memory so optimisation runs.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

