[workspace]
resolver = "2"
members = [
    "crates/s1-model",
    "crates/s1-ops",
    "crates/s1-format-docx",
    "crates/s1-format-odt",
    "crates/s1-format-pdf",
    "crates/s1-format-txt",
    "crates/s1-format-md",
    "crates/s1-convert",
    "crates/s1-layout",
    "crates/s1-text",
    "crates/s1-ooxml",
    "crates/s1-odf",
    "crates/s1engine",
    "ffi/wasm",
    "ffi/c",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/schnsrw/core"
homepage = "https://github.com/schnsrw/core"
keywords = ["document", "docx", "odt", "pdf", "wasm"]
categories = ["parsing", "text-processing", "web-programming"]

[workspace.dependencies]
s1-model = { version = "0.2.0", path = "crates/s1-model" }
s1-ops = { version = "0.2.0", path = "crates/s1-ops" }
s1-format-docx = { version = "0.2.0", path = "crates/s1-format-docx" }
s1-format-odt = { version = "0.2.0", path = "crates/s1-format-odt" }
s1-format-pdf = { version = "0.2.0", path = "crates/s1-format-pdf" }
s1-format-txt = { version = "0.2.0", path = "crates/s1-format-txt" }
s1-format-md = { version = "0.2.0", path = "crates/s1-format-md" }
s1-convert = { version = "0.2.0", path = "crates/s1-convert" }
s1-layout = { version = "0.2.0", path = "crates/s1-layout" }
s1-text = { version = "0.2.0", path = "crates/s1-text" }
s1-ooxml = { version = "0.2.0", path = "crates/s1-ooxml" }
s1-odf = { version = "0.2.0", path = "crates/s1-odf" }
s1engine = { version = "0.2.0", path = "crates/s1engine" }

thiserror = "2"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
encoding_rs = "0.8"
pulldown-cmark = "0.12"

ring = "0.17"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

proptest = "1"
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Size-focused profile used by the WASM build pipeline.
# `opt-level = "z"` trades a small amount of speed for substantially smaller
# code; `panic = "abort"` removes the unwinding tables (we don't catch_unwind
# in this crate); `lto`/`codegen-units` are inherited from release.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
debug = false
overflow-checks = false

# Clippy is gated as `-D warnings` in CI. These two style lints are inherited
# from the original codebase and are tracked as cleanup work — silence them
# at the workspace level so CI stays green while real issues surface.
[workspace.lints.clippy]
field_reassign_with_default = "allow"
too_many_arguments = "allow"
